plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = 'Shogunitems'
}

def azureLibJar = layout.projectDirectory.file("libs/azurelib-fabric-1.21.1-${project.azurelib_version}.jar").asFile
if (!azureLibJar.exists()) {
	azureLibJar.parentFile.mkdirs()
	def azureLibUrl = "https://cdn.modrinth.com/data/7zlUOZvb/versions/9iKX3SwF/azurelib-fabric-1.21.1-${project.azurelib_version}.jar"
	logger.lifecycle("Downloading AzureLib Fabric 1.21.1 from Modrinth ({})", azureLibUrl)
	new URI(azureLibUrl).toURL().withInputStream { input ->
		azureLibJar.withOutputStream { output -> output << input }
	}
}

repositories {
	maven {
		name = 'AzureDoom Mods'
		url = 'https://maven.azuredoom.com/mods'
	}
}

loom {
	splitEnvironmentSourceSets()

	mixin {
		useLegacyMixinAp = true
		defaultRefmapName = "zk-nomosiki-items.refmap.json"
	}

	mods {
		"zk-nomosiki-items" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	modImplementation files(azureLibJar)
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
	from("NOTICE")
	from("LICENSE_ASSETS.md")
	from("LICENSE_MUSKETMOD.txt")
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
